<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Entorno 3D - UNAL</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      overscroll-behavior: none;
      touch-action: none;
      font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #090d16;
      color: #f8fafc;
      -webkit-font-smoothing: antialiased;
    }
    #canvas-container {
      width: 100%;
      height: 100%;
      position: absolute;
      inset: 0;
      touch-action: none;
    }

    /* Minimalist Top Bar */
    header {
      position: absolute;
      top: 20px;
      left: 20px;
      right: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      pointer-events: none;
      z-index: 10;
    }
    .header-card {
      pointer-events: auto;
      background: rgba(9, 13, 22, 0.55);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      padding: 8px 14px;
      border-radius: 999px;
      display: flex;
      align-items: center;
      gap: 10px;
      box-shadow: 0 4px 24px rgba(0, 0, 0, 0.25);
    }
    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #38bdf8;
      box-shadow: 0 0 8px rgba(56, 189, 248, 0.7);
      flex-shrink: 0;
    }
    .title {
      font-size: 13px;
      font-weight: 600;
      letter-spacing: -0.01em;
      color: #f1f5f9;
    }
    .divider-v {
      width: 1px;
      height: 12px;
      background: rgba(255, 255, 255, 0.12);
    }
    .subtitle {
      font-size: 11px;
      color: #94a3b8;
      font-weight: 400;
    }

    /* Minimalist Help Toggle (top-right) */
    .help-wrap {
      pointer-events: auto;
      position: relative;
    }
    .help-btn {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      background: rgba(9, 13, 22, 0.55);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      color: #94a3b8;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
    }
    .help-btn:hover {
      color: #f8fafc;
      border-color: rgba(255, 255, 255, 0.22);
    }
    .help-card {
      position: absolute;
      top: 42px;
      right: 0;
      width: 215px;
      background: rgba(9, 13, 22, 0.85);
      backdrop-filter: blur(18px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 12px 14px;
      border-radius: 12px;
      font-size: 11px;
      color: #94a3b8;
      line-height: 1.7;
      opacity: 0;
      transform: translateY(-4px);
      pointer-events: none;
      transition: all 0.2s ease;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.4);
    }
    .help-wrap:hover .help-card,
    .help-wrap:focus-within .help-card,
    .help-wrap.open .help-card {
      opacity: 1;
      transform: translateY(0);
      pointer-events: auto;
    }
    .help-card b {
      color: #e2e8f0;
      font-weight: 500;
    }

    /* Minimalist Floating Dock */
    .toolbar {
      position: absolute;
      bottom: 22px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      gap: 4px;
      background: rgba(9, 13, 22, 0.62);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      padding: 5px;
      border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, 0.09);
      box-shadow: 0 10px 36px rgba(0, 0, 0, 0.45);
      z-index: 10;
    }
    .tool-btn {
      background: transparent;
      border: 1px solid transparent;
      color: #cbd5e1;
      padding: 7px 12px;
      border-radius: 999px;
      cursor: pointer;
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 0.01em;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.18s ease;
      white-space: nowrap;
    }
    .tool-btn svg {
      width: 14px;
      height: 14px;
      stroke: currentColor;
      fill: none;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
      flex-shrink: 0;
    }
    .tool-btn:hover {
      background: rgba(255, 255, 255, 0.08);
      color: #ffffff;
    }
    .tool-btn.active {
      background: rgba(255, 255, 255, 0.14);
      border-color: rgba(255, 255, 255, 0.18);
      color: #ffffff;
    }
    .dock-sep {
      width: 1px;
      height: 16px;
      background: rgba(255, 255, 255, 0.1);
      margin: 0 2px;
    }

    /* Minimalist Start / Loading Screen */
    #loader {
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 50% 45%, #111827 0%, #070a11 100%);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 100;
      transition: opacity 0.6s cubic-bezier(0.16, 1, 0.3, 1);
    }
    #loader.hidden {
      opacity: 0;
      pointer-events: none;
    }
    .loader-mark {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      background: rgba(255, 255, 255, 0.03);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 20px;
      position: relative;
    }
    .loader-mark::after {
      content: "";
      position: absolute;
      inset: -4px;
      border-radius: 15px;
      border: 1px solid rgba(56, 189, 248, 0.25);
      animation: pulseRing 2.2s ease-out infinite;
    }
    @keyframes pulseRing {
      0% { transform: scale(0.95); opacity: 0.8; }
      100% { transform: scale(1.25); opacity: 0; }
    }
    .loader-title {
      font-size: 20px;
      font-weight: 600;
      letter-spacing: -0.02em;
      color: #f8fafc;
      margin-bottom: 4px;
    }
    .loading-status {
      font-size: 12px;
      font-weight: 400;
      color: #64748b;
      letter-spacing: 0.03em;
      text-transform: uppercase;
    }
    .progress-bar-container {
      width: 220px;
      height: 2px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 999px;
      overflow: hidden;
      margin-top: 22px;
    }
    .progress-bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #38bdf8, #818cf8);
      transition: width 0.25s ease;
    }
    .loading-details {
      font-size: 11px;
      color: #475569;
      margin-top: 10px;
      font-variant-numeric: tabular-nums;
    }

    /* Drag & Drop Overlay Alert */
    #drop-prompt {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
      background: rgba(15, 23, 42, 0.85);
      border: 2px dashed rgba(59, 130, 246, 0.5);
      padding: 30px 40px;
      border-radius: 16px;
      backdrop-filter: blur(12px);
      display: none;
      z-index: 50;
      max-width: 420px;
    }
    #drop-prompt h3 {
      font-size: 18px;
      margin-bottom: 8px;
    }
    #drop-prompt p {
      font-size: 13px;
      color: #94a3b8;
      margin-bottom: 16px;
      line-height: 1.4;
    }
    .upload-btn {
      display: inline-block;
      background: #2563eb;
      color: white;
      padding: 8px 16px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    .upload-btn:hover {
      background: #1d4ed8;
    }
    input[type="file"] {
      display: none;
    }

    @media (max-width: 640px) {
      header { top: max(14px, env(safe-area-inset-top)); left: 12px; right: 12px; }
      .header-card { padding: 6px 11px; max-width: calc(100vw - 70px); }
      .subtitle { display: none; }
      .divider-v { display: none; }
      .help-btn { width: 38px; height: 38px; }
      .toolbar {
        bottom: max(16px, env(safe-area-inset-bottom));
        max-width: calc(100vw - 24px);
        padding: 5px 6px;
        gap: 3px;
      }
      .tool-btn {
        min-width: 44px;
        min-height: 44px;
        justify-content: center;
        padding: 10px 12px;
      }
      .tool-btn svg { width: 17px; height: 17px; }
      .tool-btn span { display: none; }
    }
  </style>

  <!-- Import maps polyfill for Three.js ES Modules -->
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>

  <div id="canvas-container"></div>

  <!-- Header -->
  <header>
    <div class="header-card">
      <span class="status-dot"></span>
      <span class="title">Campus UNAL</span>
      <span class="divider-v"></span>
      <span class="subtitle" id="stats-info">Cargando 3D...</span>
    </div>

    <div class="help-wrap">
      <button class="help-btn" aria-label="Controles" title="Controles">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
      </button>
      <div class="help-card">
        <div><b>1 dedo / Clic izq.:</b> Girar</div>
        <div><b>2 dedos / Clic der.:</b> Mover</div>
        <div><b>Pellizcar / Rueda:</b> Zoom</div>
      </div>
    </div>
  </header>

  <!-- Minimalist Floating Dock -->
  <div class="toolbar">
    <button class="tool-btn" id="btn-reset" title="Vista inicial">
      <svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg>
      <span>Inicio</span>
    </button>
    <button class="tool-btn" id="btn-top" title="Vista aérea">
      <svg viewBox="0 0 24 24"><polygon points="12 2 2 7 12 12 22 7 12 2"/><polyline points="2 17 12 22 22 17"/><polyline points="2 12 12 17 22 12"/></svg>
      <span>Aérea</span>
    </button>
    <span class="dock-sep"></span>
    <button class="tool-btn" id="btn-rotate" title="Auto-rotar">
      <svg viewBox="0 0 24 24"><path d="M21 12a9 9 0 0 0-9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/><path d="M3 12a9 9 0 0 0 9 9 9.75 9.75 0 0 0 6.74-2.74L21 16"/><path d="M16 16h5v5"/></svg>
      <span>Rotar</span>
    </button>
    <button class="tool-btn" id="btn-wireframe" title="Modo malla">
      <svg viewBox="0 0 24 24"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 7v10l10 5 10-5V7"/><line x1="12" y1="12" x2="12" y2="22"/></svg>
      <span>Malla</span>
    </button>
    <span class="dock-sep"></span>
    <button class="tool-btn" id="btn-fullscreen" title="Pantalla completa">
      <svg viewBox="0 0 24 24"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/></svg>
    </button>
  </div>

  <!-- Minimalist Loading Screen -->
  <div id="loader">
    <div class="loader-mark">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#38bdf8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg>
    </div>
    <div class="loader-title">Campus UNAL</div>
    <div class="loading-status" id="load-text">Preparando entorno 3D</div>
    <div class="progress-bar-container">
      <div class="progress-bar" id="load-bar"></div>
    </div>
    <div class="loading-details" id="load-details">0%</div>
  </div>

  <!-- Fallback Drop Prompt (if Unal.glb is not present yet) -->
  <div id="drop-prompt">
    <h3>Arrastra tu archivo 3D (.glb)</h3>
    <p>Coloca tu archivo <code>Unal.glb</code> en esta carpeta o selecciónalo para previsualizarlo de inmediato.</p>
    <label class="upload-btn" for="manual-file-input">Seleccionar archivo .glb</label>
    <input type="file" id="manual-file-input" accept=".glb,.gltf">
  </div>

  <!-- Main Three.js Application Logic -->
  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
    import { DRACOLoader } from 'three/addons/loaders/DRACOLoader.js';

    // Application State
    let scene, camera, renderer, controls;
    let currentModel = null;
    let autoRotate = false;
    let isWireframe = false;
    let initialCameraState = { pos: null, target: null };

    const MODEL_PATH = 'Unal.glb?v=2'; // Cache-busted relative path for GitHub Pages

    // UI Elements
    const container = document.getElementById('canvas-container');
    const loaderEl = document.getElementById('loader');
    const loadBar = document.getElementById('load-bar');
    const loadText = document.getElementById('load-text');
    const loadDetails = document.getElementById('load-details');
    const statsInfo = document.getElementById('stats-info');
    const dropPrompt = document.getElementById('drop-prompt');
    const fileInput = document.getElementById('manual-file-input');

    const btnReset = document.getElementById('btn-reset');
    const btnTop = document.getElementById('btn-top');
    const btnRotate = document.getElementById('btn-rotate');
    const btnWireframe = document.getElementById('btn-wireframe');
    const btnFullscreen = document.getElementById('btn-fullscreen');

    // Layer references
    let terrainMeshRef = null;

    // Lights
    let hemiLight, dirLight, ambientLight;

    function init() {
      // 1. Scene
      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x090d16);

      // 2. Camera
      camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000000);
      camera.position.set(100, 100, 150);

      // 3. Renderer (tuned pixel ratio for smooth 60fps on Android GPUs)
      const isTouchDevice = ('ontouchstart' in window) || navigator.maxTouchPoints > 0;
      renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false, powerPreference: 'high-performance' });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, isTouchDevice ? 1.5 : 2));
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.1;
      renderer.shadowMap.enabled = !isTouchDevice;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;
      container.appendChild(renderer.domElement);

      // 4. Controls (optimized multi-touch gestures for Android)
      controls = new OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      controls.dampingFactor = 0.06;
      controls.screenSpacePanning = true;
      controls.rotateSpeed = isTouchDevice ? 0.75 : 1.0;
      controls.panSpeed = isTouchDevice ? 0.9 : 1.0;
      controls.zoomSpeed = isTouchDevice ? 1.15 : 1.0;
      controls.touches = {
        ONE: THREE.TOUCH.ROTATE,
        TWO: THREE.TOUCH.DOLLY_PAN
      };
      controls.maxPolarAngle = Math.PI / 2 + 0.05; // Prevent camera going deeply underground

      // 6. Lighting Setup
      setupLights();

      // 7. Event Listeners
      window.addEventListener('resize', onWindowResize);
      setupEvents();

      // 8. Load Model
      load3DModel(MODEL_PATH);

      // 9. Animation Loop
      animate();
    }

    function setupLights() {
      ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
      scene.add(ambientLight);

      hemiLight = new THREE.HemisphereLight(0xffffff, 0x334155, 0.7);
      hemiLight.position.set(0, 200, 0);
      scene.add(hemiLight);

      dirLight = new THREE.DirectionalLight(0xfffaed, 1.4);
      dirLight.position.set(150, 250, 150);
      dirLight.castShadow = true;
      dirLight.shadow.mapSize.width = 2048;
      dirLight.shadow.mapSize.height = 2048;
      dirLight.shadow.camera.near = 10;
      dirLight.shadow.camera.far = 1000;
      const d = 300;
      dirLight.shadow.camera.left = -d;
      dirLight.shadow.camera.right = d;
      dirLight.shadow.camera.top = d;
      dirLight.shadow.camera.bottom = -d;
      dirLight.shadow.bias = -0.0005;
      scene.add(dirLight);
    }

    function setupEvents() {
      // Touch-friendly help toggle
      const helpWrap = document.querySelector('.help-wrap');
      const helpBtn = document.querySelector('.help-btn');
      if (helpBtn && helpWrap) {
        helpBtn.addEventListener('click', (e) => {
          e.stopPropagation();
          helpWrap.classList.toggle('open');
        });
        document.addEventListener('pointerdown', (e) => {
          if (!helpWrap.contains(e.target)) helpWrap.classList.remove('open');
        });
      }

      // Toolbar Buttons
      btnReset.addEventListener('click', () => {
        if (initialCameraState.pos && initialCameraState.target) {
          camera.position.copy(initialCameraState.pos);
          controls.target.copy(initialCameraState.target);
          controls.update();
        }
      });

      btnTop.addEventListener('click', () => {
        if (currentModel) {
          const focusObj = terrainMeshRef || currentModel;
          const box = new THREE.Box3().setFromObject(focusObj);
          const center = box.getCenter(new THREE.Vector3());
          const size = box.getSize(new THREE.Vector3());
          const maxDim = Math.max(size.x, size.z, 100);
          camera.position.set(center.x, center.y + maxDim * 0.95, center.z + 0.1);
          camera.lookAt(center);
          controls.target.copy(center);
          controls.update();
        }
      });

      btnRotate.addEventListener('click', () => {
        autoRotate = !autoRotate;
        controls.autoRotate = autoRotate;
        controls.autoRotateSpeed = 1.5;
        btnRotate.classList.toggle('active', autoRotate);
      });

      btnWireframe.addEventListener('click', () => {
        isWireframe = !isWireframe;
        btnWireframe.classList.toggle('active', isWireframe);
        if (currentModel) {
          currentModel.traverse((node) => {
            if (node.isMesh && node.material) {
              if (Array.isArray(node.material)) {
                node.material.forEach(m => m.wireframe = isWireframe);
              } else {
                node.material.wireframe = isWireframe;
              }
            }
          });
        }
      });

      btnFullscreen.addEventListener('click', () => {
        if (!document.fullscreenElement) {
          document.documentElement.requestFullscreen().catch(() => {});
        } else {
          document.exitFullscreen().catch(() => {});
        }
      });

      // Drag and Drop & Manual File Picker
      window.addEventListener('dragover', (e) => e.preventDefault());
      window.addEventListener('drop', (e) => {
        e.preventDefault();
        const file = e.dataTransfer.files[0];
        if (file && (file.name.endsWith('.glb') || file.name.endsWith('.gltf'))) {
          loadModelFromFile(file);
        }
      });

      fileInput.addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (file) loadModelFromFile(file);
      });
    }

    function createLoader() {
      const gltfLoader = new GLTFLoader();
      const dracoLoader = new DRACOLoader();
      dracoLoader.setDecoderPath('https://www.gstatic.com/draco/versioned/decoders/1.5.6/');
      gltfLoader.setDRACOLoader(dracoLoader);
      return gltfLoader;
    }

    function load3DModel(url) {
      const loader = createLoader();
      loaderEl.classList.remove('hidden');
      loadText.innerText = "Cargando modelo 3D...";
      loadBar.style.width = '10%';

      loader.load(
        url,
        (gltf) => {
          onModelLoaded(gltf.scene);
        },
        (xhr) => {
          if (xhr.lengthComputable && xhr.total > 0) {
            const percent = Math.round((xhr.loaded / xhr.total) * 100);
            loadBar.style.width = `${percent}%`;
            loadDetails.innerText = `${(xhr.loaded / (1024*1024)).toFixed(1)} MB / ${(xhr.total / (1024*1024)).toFixed(1)} MB (${percent}%)`;
          } else {
            const mb = (xhr.loaded / (1024 * 1024)).toFixed(1);
            loadDetails.innerText = `Descargado: ${mb} MB...`;
          }
        },
        (error) => {
          console.warn("No se encontró el archivo local por defecto:", error);
          loaderEl.classList.add('hidden');
          statsInfo.innerText = "Esperando archivo Unal.glb...";
          dropPrompt.style.display = 'block';
        }
      );
    }

    function loadModelFromFile(file) {
      dropPrompt.style.display = 'none';
      loaderEl.classList.remove('hidden');
      loadText.innerText = `Cargando ${file.name}...`;
      loadBar.style.width = '30%';

      const reader = new FileReader();
      reader.onload = (e) => {
        const contents = e.target.result;
        const loader = createLoader();
        loader.parse(contents, '', (gltf) => {
          onModelLoaded(gltf.scene, file.name);
        }, (err) => {
          alert('Error al leer el archivo 3D: ' + err.message);
          loaderEl.classList.add('hidden');
        });
      };
      reader.readAsArrayBuffer(file);
    }

    function onModelLoaded(model, name = 'Unal.glb') {
      if (currentModel) {
        scene.remove(currentModel);
      }
      currentModel = model;

      let meshCount = 0;
      let vertexCount = 0;
      const campusBox = new THREE.Box3();
      let hasCampusMeshes = false;

      terrainMeshRef = null;
      const buildingsRefs = [];

      let satTexture = null;
      let satWorldBox = null;
      let terrainNode = null;
      let roadNode = null;

      currentModel.updateMatrixWorld(true);

      currentModel.traverse((node) => {
        if (node.isMesh) {
          meshCount++;
          if (node.geometry) {
            vertexCount += node.geometry.attributes.position ? node.geometry.attributes.position.count : 0;
          }
          node.castShadow = true;
          node.receiveShadow = true;
          if (node.material) {
            if (Array.isArray(node.material)) {
              node.material.forEach(m => { m.side = THREE.DoubleSide; });
            } else {
              node.material.side = THREE.DoubleSide;
            }
          }

          const nName = node.name || '';
          const pName = (node.parent && node.parent.name) ? node.parent.name : '';
          const fullLower = (nName + ' ' + pName).toLowerCase();

          // Grab Google Satellite texture, then keep ONLY Buildings (Plane.004), Roads (Roads.001), and Terrain visible
          if (fullLower.includes('google_sat')) {
            const mat = Array.isArray(node.material) ? node.material[0] : node.material;
            if (mat && mat.map) satTexture = mat.map;
            node.visible = false;
            return;
          }

          if (nName.includes('Terrain') || pName.includes('Terrain')) {
            node.visible = true;
            terrainNode = node;
          } else if (nName.includes('Roads') || pName.includes('Roads')) {
            node.visible = false;
            roadNode = node;
          } else if (fullLower.includes('plane004') || fullLower.includes('plane.004') || fullLower.includes('plane006') || fullLower.includes('plane.006')) {
            node.visible = true;
            buildingsRefs.push(node);
          } else {
            node.visible = false;
          }
        }
      });

      // Drape Google Satellite texture onto Terrain using pre-shift calibrated UVs
      if (terrainNode && satTexture) {
        terrainMeshRef = terrainNode;
        satTexture.wrapS = THREE.ClampToEdgeWrapping;
        satTexture.wrapT = THREE.ClampToEdgeWrapping;
        satTexture.flipY = false;

        const posAttr = terrainNode.geometry.attributes.position;
        const uvs = new Float32Array(posAttr.count * 2);
        const vTmp = new THREE.Vector3();
        for (let i = 0; i < posAttr.count; i++) {
          vTmp.fromBufferAttribute(posAttr, i).applyMatrix4(terrainNode.matrixWorld);
          uvs[i * 2] = 0.318 + (vTmp.x + 385.5) / 2050.0;
          uvs[i * 2 + 1] = 0.722 + (vTmp.z - 381.5) / 1520.0;
        }
        terrainNode.geometry.setAttribute('uv', new THREE.BufferAttribute(uvs, 2));

        const mats = Array.isArray(terrainNode.material) ? terrainNode.material : [terrainNode.material];
        mats.forEach(m => {
          if (m) {
            m.map = satTexture;
            m.color.setHex(0xffffff);
            m.roughness = 0.9;
            m.metalness = 0.0;
            m.needsUpdate = true;
          }
        });
      }

      // Strip giant flat background plane triangles (edge >= 250) from Buildings, then apply exact calibrated transforms
      buildingsRefs.forEach(b => {
        const geom = b.geometry;
        if (geom && geom.index && geom.attributes.position) {
          const pos = geom.attributes.position;
          const idx = geom.index;
          const kept = [];
          const a = new THREE.Vector3(), bb = new THREE.Vector3(), c = new THREE.Vector3();
          for (let i = 0; i < idx.count; i += 3) {
            const i0 = idx.getX(i), i1 = idx.getX(i + 1), i2 = idx.getX(i + 2);
            a.fromBufferAttribute(pos, i0);
            bb.fromBufferAttribute(pos, i1);
            c.fromBufferAttribute(pos, i2);
            if (a.distanceTo(bb) < 250 && bb.distanceTo(c) < 250 && c.distanceTo(a) < 250) {
              kept.push(i0, i1, i2);
            }
          }
          if (kept.length > 0 && kept.length < idx.count) {
            geom.setIndex(kept);
            geom.computeBoundingBox();
            geom.computeBoundingSphere();
          }
        }
        b.position.set(-28.123, 267.581, -39.247);
        b.scale.set(1.2788, 1.2, 1.1711);
      });

      if (roadNode) {
        roadNode.position.set(67.885, 77.766, -93.106);
        roadNode.scale.set(0.9215, 0.8682, 1);
      }

      if (terrainNode) {
        terrainNode.position.set(114.667, 77.766, -101.617);
        terrainNode.scale.set(1, 0.8723, 1);
      }
      currentModel.updateMatrixWorld(true);

      // Frame & center model around calibrated Terrain
      const box = terrainNode ? new THREE.Box3().setFromObject(terrainNode) : new THREE.Box3().setFromObject(currentModel);
      const center = box.getCenter(new THREE.Vector3());
      const size = box.getSize(new THREE.Vector3());
      currentModel.position.sub(center);
      currentModel.updateMatrixWorld(true);

      const maxDim = Math.max(size.x, size.y, size.z, 1);

      // Adjust camera clipping planes & distance dynamically
      camera.near = Math.max(0.1, maxDim * 0.0005);
      camera.far = maxDim * 20;
      camera.updateProjectionMatrix();

      // Default view: Aerial (top-down over campus)
      const aerialDist = Math.max(size.x, size.z, 100) * 0.95;
      camera.position.set(0, aerialDist, 0.1);
      camera.lookAt(0, 0, 0);
      controls.target.set(0, 0, 0);
      controls.maxDistance = maxDim * 8;
      controls.minDistance = maxDim * 0.01;
      controls.update();

      initialCameraState.pos = camera.position.clone();
      initialCameraState.target = controls.target.clone();

      scene.add(currentModel);

      // Update UI
      loaderEl.classList.add('hidden');
      dropPrompt.style.display = 'none';
      statsInfo.innerText = `${name} | ${meshCount} mallas | ${(vertexCount / 1000).toFixed(0)}k vértices`;
    }

    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }

    init();
  </script>
</body>
</html>
